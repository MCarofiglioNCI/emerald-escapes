<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
	<script src="js/bootstrap.min.js" defer></script>
    <script src="js/contact.js" defer></script>
	<script src="js/main.js" defer></script>
	<title>Emerald Travels</title>
</head>
<body>
    <header>
        <nav class="site-nav">
            <div class="width-container">
                <div class="nav-logo">
                    LOGO
                </div>
                <div class="nav-main">
                    <div><a href="index.html">Home</a></div>
                    <div><a href="experiences.html">Experience</a></div>
                    <div><a href="contact.html">Contact Us</a></div>
                </div>
                <div class="nav-extra">
                    BUTTON
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="width-container main-container">
            <h1>Contact and Booking Enquiries</h1>
            <p>Fill in the form below and our team will get back to you within 24 hours.</p>

            <div id="form-success" class="form-success" hidden></div>

            <form id="contact-form" novalidate>

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name">
                    <small class="error" id="name-error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <small class="error" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" pattern="\+?[0-9 \-]{7,20}">
                    <small class="error" id="phone-error"></small>
                </div>

                <div class="form-group">
                    <label for="query-type">Query type</label>
                    <select id="query-type" name="query-type">
                        <option value="" disabled selected>Please choose an option</option>
                        <option value="booking">Booking</option>
                        <option value="payment">Payment</option>
                        <option value="general">General Information</option>
                        <option value="other">Other</option>
                    </select>
                    <small class="error" id="query-type-error"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="hint">(at least 20 characters)</span></label>
                    <textarea id="message" name="message" rows="6"></textarea>
                    <small class="error" id="message-error"></small>
                </div>

                <button type="submit">Send enquiry</button>
            </form>
        </div>
    </main>

    <footer>

    </footer>
</body>
</html>
