<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
	<script src="js/experiences.js" defer></script>
	<script src="js/bootstrap.min.js" defer></script>
	<script src="js/main.js" defer></script>
	<title>Emerald Travels</title>
</head>
<body>
    <header>
        <nav class="site-nav">
            <div class="nav-logo">
                LOGO
            </div>
            <div class="nav-main">
                <div><a href="index.html">Home</a></div>
                <div><a href="#">Experience</a></div>
                <div><a href="contact.html">Contact Us</a></div>
            </div>
            <div class="nav-extra">
                BUTTON
            </div>
        </nav>
    </header>

    <main>
        <div class="main-container">
            <div id="filter-section">
                <label for="filter-category">Category</label>
                <select id="filter-category"></select>

                <label for="filter-location">Location</label>
                <select id="filter-location"></select>

                <label for="filter-price">Max price: <span id="price-value"></span></label>
                <input type="range" id="filter-price" step="5">

                <label for="sort-by">Sort by</label>
                <select id="sort-by">
                    <option value="default">Recommended</option>
                    <option value="price-asc">Price: low to high</option>
                    <option value="price-desc">Price: high to low</option>
                    <option value="duration-asc">Duration: shortest first</option>
                </select>
            </div>
            <p id="no-results" hidden>No experiences match your filters.</p>
            <div id="card-section">

            </div>
        </div>
    </main>

    <footer>

    </footer>
</body>
</html>
